services:
  workspacekafka:
    image: workspacekafka
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m uvicorn services.kafka-http-demo\app:app --host 0.0.0.0 --port 6000"]
    ports:
      - 6000:6000
      - 5678:5678
