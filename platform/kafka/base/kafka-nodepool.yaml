apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: local
  labels:
    strimzi.io/cluster: local-kafka
spec:
  replicas: 3
  roles:
    - broker
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "1500m"
      memory: 1536Mi
