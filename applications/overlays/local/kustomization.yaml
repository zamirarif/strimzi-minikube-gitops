apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: platform-namespaces
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/namespaces/overlays/local
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: strimzi-operator
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/infrastructure/strimzi/overlays/local/values.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: local-kafka
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/kafka/overlays/local
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: monitoring
    patch: |-
      - op: add
        path: /spec/sources/1/path
        value: platform/monitoring/overlays/local
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/infrastructure/monitoring/overlays/local/values.yaml
