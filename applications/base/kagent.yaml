apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zamirarif/strimzi-minikube-gitops.git
    targetRevision: main
    path: platform/kagent/base
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
