apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: topic-explorer
  labels:
    strimzi.io/cluster: local-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Describe
          - DescribeConfigs
          - Read
        host: "*"
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - Describe
          - Read
        host: "*"
      - resource:
          type: cluster
          name: kafka-cluster
        operations:
          - Describe
        host: "*"
