apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
data:
  config.yaml: |
    kafka:
      brokers:
        - local-kafka-kafka-bootstrap:9092
      sasl:
        enabled: true
        mechanism: SCRAM-SHA-512
    server:
      listenAddress: "127.0.0.1"
      listenPort: 8080
