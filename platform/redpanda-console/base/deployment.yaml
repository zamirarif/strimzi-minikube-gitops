apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-console
    spec:
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.14.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_FILEPATH
              value: /etc/console/config.yaml
            - name: KAFKA_SASL_USERNAME
              value: topic-explorer
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: topic-explorer
                  key: password
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/console
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: auth-proxy
          image: nginxinc/nginx-unprivileged:1.29.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy-http
              containerPort: 8081
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: proxy-http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: proxy-http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: auth-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 101
      volumes:
        - name: config
          configMap:
            name: redpanda-console-config
        - name: tmp
          emptyDir: {}
        - name: auth-proxy-config
          configMap:
            name: redpanda-console-auth-proxy
        - name: auth
          secret:
            secretName: redpanda-console-auth
            items:
              - key: htpasswd
                path: htpasswd
        - name: proxy-tmp
          emptyDir: {}
