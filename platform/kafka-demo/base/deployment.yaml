apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-http-demo
  labels:
    app.kubernetes.io/name: kafka-http-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-http-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-http-demo
    spec:
      containers:
        - name: app
          image: kafka-http-demo:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: local-kafka-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: test-topic
            - name: KAFKA_CONSUMER_GROUP
              value: kafka-http-demo
            - name: KAFKA_SASL_USERNAME
              value: app-user
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-user
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
