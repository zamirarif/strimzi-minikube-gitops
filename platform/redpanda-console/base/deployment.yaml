apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-console
    spec:
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.14.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_FILEPATH
              value: /etc/console/config.yaml
            - name: KAFKA_SASL_USERNAME
              value: topic-explorer
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: topic-explorer
                  key: password
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/console
              readOnly: true
            - name: tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 10001
      volumes:
        - name: config
          configMap:
            name: redpanda-console-config
        - name: tmp
          emptyDir: {}
