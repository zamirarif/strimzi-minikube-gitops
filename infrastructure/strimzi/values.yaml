replicas: 1
watchNamespaces:
  - kafka
watchAnyNamespace: false
defaultImageRegistry: quay.io
defaultImageRepository: strimzi
defaultImageTag: 1.3.0
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
leaderElection:
  enable: true
podDisruptionBudget:
  enabled: false
operatorNetworkPolicy:
  enabled: false
